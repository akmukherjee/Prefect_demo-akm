# Welcome to your prefect.yaml file! You can use this file for storing and managing
# configuration for deploying your flows. We recommend committing this file to source
# control along with your flow code.

# Generic metadata about this project
name: Prefect-Demo-Workflow
prefect-version: 2.20.3

# build section allows you to manage and build docker images
build: null

# push section allows you to manage if and how this project is uploaded to remote locations
push: null

# pull section allows you to provide instructions for cloning this project in remote locations

pull:
  - prefect.deployments.steps.git_clone:
      id: clone-step
      repository: https://github.com/akmukherjee/Prefect_demo-akm.git
      branch: file_copy_demo
  - prefect.deployments.steps.pip_install_requirements:
      requirements_file: requirements.txt
      directory: "{{ clone-step.directory }}"
      stream_output: False

# the deployments section allows you to provide configuration for deploying flows
deployments:
  # base metadata
  - name: happy-birthday
    version: null
    tags: ["HAPPY BIRTHDAY"]
    description: null
    entrypoint: workflow/happy_birthday_prefect.py:runner
    schedule: null

    # flow-specific parameters
    parameters:
      user_name: "user"
      celebration_mode: "no"

    # pull action to overwrite from file pull action
    pull:
      - prefect.deployments.steps.git_clone:
          id: clone-step
          repository: https://github.com/akmukherjee/Prefect_demo-akm.git
          branch: file_copy_demo
      - prefect.deployments.steps.pip_install_requirements:
          requirements_file: requirements.txt
          directory: "{{ clone-step.directory }}"
          stream_output: False

    # infra-specific fields
    work_pool:
      name:  fnl-bento-8gb-prefect-2.20.3-python3.9
      work_queue_name: null
      job_variables: {}

  - name: file-copy-s3-akm
    version: null
    tags: ["Training"]
    description: null
    entrypoint: workflow/copy_file_s3.py:copy_object_s3
    schedule: null

    # flow-specific parameters
    parameters:

    # pull action to overwrite from file pull action
    pull:
      - prefect.deployments.steps.git_clone:
          id: clone-step
          repository: https://github.com/akmukherjee/Prefect_demo-akm.git
          branch: file_copy_demo
      - prefect.deployments.steps.pip_install_requirements:
          requirements_file: requirements.txt
          directory: "{{ clone-step.directory }}"
          stream_output: False

    # infra-specific fields
    work_pool:
      name: fnl-bento-8gb-prefect-2.20.3-python3.9
      work_queue_name: null
      job_variables: {}